services:
  postgres:
    image: postgres:18
    container_name: securepay-postgres-full
    restart: unless-stopped
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-securepay}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data_full:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-securepay}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - securepay-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: securepay-keycloak-full
    restart: unless-stopped
    command: start-dev
    ports:
      - "8082:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
      - keycloak_data_full:/opt/keycloak/data
    networks:
      - securepay-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: securepay-backend-full
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-securepay}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM:-securepay}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-securepay}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-securepay-backend}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
      GATEWAY_PROVIDER: ${GATEWAY_PROVIDER:-SIMULATED}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - securepay-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: securepay-frontend-full
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - securepay-network

networks:
  securepay-network:
    driver: bridge

volumes:
  postgres_data_full:
  keycloak_data_full:
