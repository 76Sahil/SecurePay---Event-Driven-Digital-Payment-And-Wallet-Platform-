spring.application.name=securepay-backend

# Database Configuration with Environment Overrides and Safe Local Defaults
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/securepay}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway Database Migration Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Keycloak Identity Provider & Admin API Configuration
keycloak.server-url=${KEYCLOAK_SERVER_URL:http://localhost:8082}
keycloak.realm=${KEYCLOAK_REALM:securepay}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:securepay-backend}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:}

# OAuth2 Resource Server JWT Validation (OIDC Issuer)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8082/realms/securepay}