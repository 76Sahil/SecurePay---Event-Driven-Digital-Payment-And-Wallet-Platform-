spring.application.name=securepay-backend-test

# Isolated In-Memory H2 Database for Unit/Integration Tests
spring.datasource.url=jdbc:h2:mem:securepay_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate for tests
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Keycloak Test Configuration
keycloak.server-url=http://localhost:8082
keycloak.realm=securepay
keycloak.client-id=securepay-backend
keycloak.client-secret=test-client-secret

# OAuth2 Resource Server JWT Issuer
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8082/realms/securepay
